name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
  BUN_VERSION: "1.3.10"

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # Its cache keeps Zig's global cache, where build.rs has `zig fetch` put libghostty-vt's packages, between runs.
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
      - name: Pinned ghostty commit
        id: ghostty
        run: |
          echo "commit=$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]*\)";$/\1/p' crates/ghostty-sys/build.rs)" >> "$GITHUB_OUTPUT"
      - name: Cache the ghostty source build.rs downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ply/ghostty
          key: ghostty-src-${{ steps.ghostty.outputs.commit }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: nextest
        run: cargo nextest run --workspace --locked --no-tests=pass
      - name: doctests
        run: cargo test --doc --workspace --locked
      - name: cargo-deny
        run: cargo deny check
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  ts:
    runs-on: macos-15
    # input.test.ts reads key/event.h from the ghostty source the rust job downloads and caches.
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - name: Pinned ghostty commit
        id: ghostty
        run: |
          echo "commit=$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]*\)";$/\1/p' crates/ghostty-sys/build.rs)" >> "$GITHUB_OUTPUT"
      - name: Restore the ghostty source
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ply/ghostty
          key: ghostty-src-${{ steps.ghostty.outputs.commit }}
          fail-on-cache-miss: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: biome
        run: bunx biome ci
      - name: tsc
        run: bunx tsc -p app && bunx tsc -p scripts
      - name: bun test
        run: bun test ./app ./scripts

  rules:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: check-rules
        run: bun scripts/check-rules.ts
      - name: check-deps
        run: bun scripts/check-deps.ts
      - name: check-pr
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/check-pr.ts
