# cargo-deny policy for every ply-* crate: INV-1 (no HTTP clients), licences, advisories.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0052", reason = "async-std, a gpui dependency; gpui 0.2.2 takes no maintained release" },
  { id = "RUSTSEC-2024-0436", reason = "paste, a gpui build dependency; gpui 0.2.2 takes no maintained release" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils, a gpui dependency; gpui 0.2.2 takes no maintained release" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, a gpui build dependency; gpui 0.2.2 takes no maintained release" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, inside gpui's image-URL client that ply never configures" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, gpui's text shaping fallback; gpui 0.2.2 takes no maintained release" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, a gpui font dependency; gpui 0.2.2 takes no maintained release" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "reqwest", reason = "INV-1: ply makes no network requests" },
  { crate = "hyper", wrappers = ["hyper-rustls", "hyper-util", "zed-reqwest"], reason = "INV-1: only inside gpui's image-URL client, which ply never configures" },
  { crate = "hyper-util", wrappers = ["hyper-rustls", "zed-reqwest"], reason = "INV-1: only inside gpui's image-URL client, which ply never configures" },
  { crate = "ureq", reason = "INV-1: ply makes no network requests" },
  { crate = "isahc", reason = "INV-1: ply makes no network requests" },
  { crate = "surf", reason = "INV-1: ply makes no network requests" },
  { crate = "attohttpc", reason = "INV-1: ply makes no network requests" },
  { crate = "curl", reason = "INV-1: ply makes no network requests" },
  { crate = "curl-sys", reason = "INV-1: ply makes no network requests" },
  { crate = "http-client", reason = "INV-1: ply makes no network requests" },
  { crate = "awc", reason = "INV-1: ply makes no network requests" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
