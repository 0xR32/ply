[workspace]
resolver = "3"
members = [
  "crates/proto",
  "crates/ghostty-sys",
  "crates/term",
  "crates/agents",
  "crates/daemon",
  "crates/hook",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
ply-proto = { path = "crates/proto" }
ghostty-sys = { path = "crates/ghostty-sys" }
ply-term = { path = "crates/term" }
ply-agents = { path = "crates/agents" }
anyhow = "=1.0.104"
notify = "=8.2.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "pty", "termios", "process", "fs", "stdio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
toml = "=1.1.6"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "ansi", "registry"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"

# `just dmg`: whole-program optimisation for the bundle; slower to build than release.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
